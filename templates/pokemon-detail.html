{{define "pokemon-detail"}}
{{template "header" .Name.Fr}}
        <article class="detail">
            {{ .Sprites.Regular}}
            <img class="cover" src="{{.}}" alt="Illustration du pokemon {{$.Titre}}">
            <h1>{{.Name}}</h1>
            <p>Pokemon N° {{.Id}}</p>
            <p>{{.Generation}}</p>
            <p>{{.Category}}</p>
            <p>{{.Types}}</p>
            <p>{{.Stats}}</p>
            <a class="btn" href="/pokemon">Retour à la liste des pokemon</a>
        </article>
{{template "footer"}}
{{end}}
